services:

  frontend:
    build: ./client

    ports:
      - "5173:5173"

    volumes:
      - ./client:/app
      - /app/node_modules

  backend:
    build: ./server

    ports:
      - "3000:3000"

    volumes:
      - ./server:/app
      - /app/node_modules

  mysql:
  image: mysql:8

  environment:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: cashyfinance

  ports:
    - "3306:3306"

  volumes:
    - mysql_data:/var/lib/mysql

  