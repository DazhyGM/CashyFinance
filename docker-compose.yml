services:

  mysql:
    image: mysql:8.0
    container_name: cashyfinance_mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: finanzas_personales

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: cashyfinance_backend

    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    env_file:
      - ./server/.env

    ports:
      - "3000:3000"

    volumes:
      - ./server:/app
      - /app/node_modules

    command: npm run dev

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile

    container_name: cashyfinance_frontend

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5173:5173"

    volumes:
      - ./client:/app
      - /app/node_modules

    command: npm run dev -- --host

volumes:
  mysql_data: